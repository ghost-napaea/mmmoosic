<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.4.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.5.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.3.0"></script>
</head>
<body>
  <div id="vis"/>
  <script>
    const spec = {
  "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
  "data": {
    "url": "https://raw.githubusercontent.com/linnorma/mmmoosic/refs/heads/main/top_songs.csv"
  },
  "title": "Duration vs. BPM of 2010's Billboard top songs",
  "params": [
    {
      "name": "YearSelect",
      "select": {"type": "point", "fields": ["year"]},
      "bind": {
        "input": "select",
        "options": [
          null,
          "2010",
          "2011",
          "2012",
          "2013",
          "2014",
          "2015",
          "2016",
          "2018",
          "2019"
        ],
        "labels": [
          "Show All",
          "2010",
          "2011",
          "2012",
          "2013",
          "2014",
          "2015",
          "2016",
          "2018",
          "2019"
        ],
        "name": "Select Year:"
      }
    }
  ],
  "transform": [{"filter": {"param": "YearSelect"}}],
  "mark": "point",
  "encoding": {
    "opacity": {"value": 0.5},
    "tooltip": [
      {"field": "title", "type": "nominal"},
      {"field": "artist", "type": "nominal"}
    ],
    "x": {
      "field": "dur",
      "type": "quantitative",
      "title": "duration (seconds)",
      "scale": {"zero": false}
    },
    "y": {"field": "bpm", "type": "quantitative", "scale": {"zero": false}}
  },
  "config": {}
};
    vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>
